version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: tradeaid_db
    environment:
      POSTGRES_USER: tradeaid
      POSTGRES_PASSWORD: dev_password_change_in_production
      POSTGRES_DB: tradeaid
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tradeaid"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tradeaid_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  redis_data:
